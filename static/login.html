<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Central de Chamados</title>
    <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <h1>🎫 Central de Chamados</h1>
        <p class="sub">Entre com sua conta para continuar</p>

        <div id="error" class="alert alert-error hidden" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" required autofocus placeholder="voce@empresa.com">
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <div class="password-wrap">
                    <input type="password" id="password" autocomplete="current-password" required>
                    <button type="button" id="toggle-pass" aria-label="Mostrar senha">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submit">Entrar</button>
        </form>

        <div class="auth-divider">ou</div>
        <a class="btn btn-secondary btn-block" href="/acompanhar">🔎 Acompanhar um chamado sem login</a>
    </div>
</main>

<script src="/static/portal.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const next = Portal.safeNext(params.get('next'));

    // Already logged in: go straight to where they were heading
    if (Portal.token() && Portal.user()) location.replace(next || Portal.homeFor(Portal.user()));

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submit = document.getElementById('submit');
    const pass = document.getElementById('password');

    document.getElementById('toggle-pass').addEventListener('click', e => {
        const show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        e.target.textContent = show ? 'Ocultar' : 'Mostrar';
    });

    form.addEventListener('submit', async e => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        const email = document.getElementById('email').value.trim();
        if (!email || !pass.value) {
            errorBox.textContent = 'Informe e-mail e senha.';
            errorBox.classList.remove('hidden');
            return;
        }
        submit.disabled = true;
        submit.textContent = 'Entrando…';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username: email, password: pass.value }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(res.status === 401 ? 'E-mail ou senha incorretos.'
                    : res.status === 429 ? 'Muitas tentativas. Aguarde alguns minutos e tente de novo.'
                    : (typeof data.detail === 'string' ? data.detail : 'Não foi possível entrar.'));
            }
            Portal.saveSession(data.access_token, data.user);
            location.href = next || Portal.homeFor(data.user);
        } catch (err) {
            errorBox.textContent = err.message === 'Failed to fetch' ? 'Não foi possível conectar ao servidor.' : err.message;
            errorBox.classList.remove('hidden');
            submit.disabled = false;
            submit.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
